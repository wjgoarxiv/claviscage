name: Docs correction
description: A typo, broken link or unclear sentence in this repository or the docs site.
labels: [docs]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: sentence
    attributes:
      label: Current sentence
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed wording
    validations:
      required: true
