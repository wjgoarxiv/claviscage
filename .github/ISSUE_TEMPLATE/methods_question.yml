name: Methods question or mismatch
description: A method note, formula, cutoff or result disagrees with a published source.
labels: [methods]
body:
  - type: markdown
    attributes:
      value: |
        For documentation, engine and scientific mismatches. Requests for the web app or Blender extension source are out of scope and will be closed.
  - type: input
    id: note
    attributes:
      label: Which note, docs page or engine file?
      placeholder: e.g. docs/methods/grade.md
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Which formula, cutoff or number?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Conflicting public source
      description: Paper (with DOI) or reference tool and version.
    validations:
      required: true
