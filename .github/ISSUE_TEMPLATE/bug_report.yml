name: Bug report
description: Something in the ClavisCage web app did not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not attach structure or trajectory files**; describe the input instead.
        Requests for the application or engine source are out of scope and will be closed.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app (What's New badge or footer).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 140 on macOS 15
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input kind
      options: [GRO, "PDB / mmCIF", "GROMACS pair (GRO + XTC/TRR/TPR)", "LAMMPS pair (data + dump)", Other]
    validations:
      required: true
  - type: dropdown
    id: algorithm
    attributes:
      label: Analysis
      options: [TRACE, HTR, GRADE, CHILL+, F3/F4, Occupancy, Rendering or export, None]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Atom/water count, frame count and any numbers the app reported help most.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I did not attach trajectories, private structures or credentials.
          required: true
